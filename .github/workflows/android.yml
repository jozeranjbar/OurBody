name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Prepare models for Android
        run: |
          rm -f dist/models/*.gz
          node -e "const fs=require('fs');const f='dist/models/atlas.json';const a=JSON.parse(fs.readFileSync(f,'utf8'));a.chunks.forEach(c=>{delete c.gzip;delete c.gzipBytes});fs.writeFileSync(f,JSON.stringify(a))"

      - name: Add Capacitor
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Create Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Set app version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$((GITHUB_RUN_NUMBER + 100))
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: OurBody-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
